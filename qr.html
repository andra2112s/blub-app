<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Mochi — QR Undangan</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px 20px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f4ef;
      color: #1c1c22;
      text-align: center;
    }
    .card {
      background: #fff;
      border: 1px solid rgba(28,28,34,.1);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 16px 40px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
    }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .sub { color: #6f6f78; font-size: .95rem; line-height: 1.5; margin-bottom: 20px; }
    #qr {
      display: block;
      width: 260px;
      height: 260px;
      margin: 0 auto 16px;
      border-radius: 16px;
      border: 1px solid rgba(28,28,34,.1);
      background: #fff;
    }
    #link {
      font-size: .82rem;
      color: #7c5cff;
      word-break: break-all;
      margin-bottom: 20px;
    }
    .row { display: flex; gap: 10px; justify-content: center; }
    button {
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .primary { background: #7c5cff; color: #fff; }
    .ghost { background: transparent; color: #1c1c22; border: 1px solid rgba(28,28,34,.15); }
    .note { font-size: .78rem; color: #6f6f78; }
    @media print {
      body { background: #fff; }
      .row, .note { display: none; }
      .card { box-shadow: none; border: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎁 Dapatkan Mochi!</h1>
    <p class="sub">Scan QR ini — Mochi langsung jalan di browser-mu,<br/>tanpa install dulu.</p>
    <img id="qr" alt="QR undangan Mochi" width="260" height="260" />
    <p id="link"></p>
    <div class="row">
      <button class="primary" onclick="window.print()">🖨️ Print</button>
      <button class="ghost" id="copy">📋 Salin link</button>
    </div>
  </div>
  <p class="note">Halaman ini khusus pemilik — tempel QR-nya di poster/kartu/IG story.</p>

  <script>
    const q = new URLSearchParams(location.search);
    const invite = new URL('./', location.href);
    invite.searchParams.set('gift', '1');
    const from = (q.get('from') || '').trim().slice(0, 24);
    if (from) invite.searchParams.set('from', from);

    const url = invite.href;
    document.getElementById('link').textContent = url;
    document.getElementById('qr').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=12&data=' +
      encodeURIComponent(url);

    document.getElementById('copy').addEventListener('click', async (e) => {
      try { await navigator.clipboard.writeText(url); } catch {}
      e.target.textContent = '✅ Tersalin!';
      setTimeout(() => (e.target.textContent = '📋 Salin link'), 1500);
    });
  </script>
</body>
</html>
