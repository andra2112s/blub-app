<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mochi — 16 Ekspresi Mata</title>
<style>
  body{margin:0;background:#0d0d14;color:#e8e8f0;font:14px/1.4 system-ui,sans-serif;padding:20px}
  h1{font-size:16px;font-weight:600;margin:0 0 4px}
  p.sub{color:#8a8a9a;margin:0 0 18px;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;max-width:760px}
  .card{background:#16161f;border:1px solid #26262f;border-radius:12px;padding:12px 8px 10px;text-align:center}
  .card svg{width:120px;height:64px;display:block;margin:0 auto}
  .nm{font-size:12px;color:#b8b8cc;margin-top:6px}
  .nm b{color:#fff}
  .used{color:#4ade80}
</style></head><body>
<h1>16 Ekspresi Mata — Mochi</h1>
<p class="sub">Tiap mata = eye(lebar, tinggi, tilt°, bukaan). · tiga yang pakai garis lengkung khusus ditandai.</p>
<div class="grid" id="grid"></div>
<script>
// params asli dari bloub-engine.js — eye(w,h,tilt,open); open default 1
const E = (w,h,t=0,o=1)=>({w,h,t,o});
const pair=(w,h,t=0,o=1)=>[E(w,h,t,o),E(w,h,-t,o)];
const CLOSED = {  // EYE_D_OVERRIDE — busur tertutup, digambar stroke
  triste:'M -8.5 -2 Q 0 9 8.5 -2', heureux:'M -10 3 Q 0 -7 10 3', hilare:'M -10 3 Q 0 -12 10 3',
  blase:'M -10 2 Q 0 -3 10 2'
};
const CW = { triste: 5.5, heureux: 6, hilare: 6, blase: 5 };
const EXPRS=[
  ['neutre',   [E(.34,.15),E(.34,.15)]],
  ['attentif', pair(.21,.44)],
  ['surpris',  pair(.45,.47)],
  ['excite',   pair(.4,.56,-10)],
  ['heureux',  pair(.27,.17,14)],
  ['hilare',   pair(.34,.13,20)],
  ['colere',   pair(.34,.15,30)],
  ['triste',   pair(.22,.4,-28)],
  ['effraye',  pair(.4,.6)],
  ['mefiant',  [E(.21,.4),E(.22,.15)]],
  ['confus',   [E(.2,.44,-18),E(.28,.17,14)]],
  ['curieux',  [E(.24,.46,-8),E(.2,.38,-8)]],
  ['fier',     pair(.3,.15,18)],
  ['timide',   pair(.17,.3)],
  ['blase',    pair(.3,.12)],
  ['somnolent',pair(.2,.08,0,.08)],
];
const grid=document.getElementById('grid');
for(const [id,eyes] of EXPRS){
  const closed=CLOSED[id];
  let inner='';
  for(const [i,e] of eyes.entries()){
    const cx=i?26:-26;
    if(closed){ inner+=`<path d="${closed}" transform="translate(${cx} -4)" fill="none" stroke="#e8e8f0" stroke-width="${CW[id]}" stroke-linecap="round"/>`; continue; }
    const w=e.w*52, h=e.h*52*Math.max(.15,e.o), r=Math.min(w,h)/2;
    inner+=`<rect x="${cx-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}" fill="#e8e8f0" transform="rotate(${e.t} ${cx} 0)"/>`;
  }
  grid.insertAdjacentHTML('beforeend',
    `<div class="card"><svg viewBox="-60 -32 120 64">${inner}</svg>`+
    `<div class="nm"><b>${id}</b>${closed?' <span class="used">· garis</span>':''}</div></div>`);
}
</script></body></html>
